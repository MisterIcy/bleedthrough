# Minimum line coverage of each domain crate, checked by `cargo xtask coverage --check`.
# A crate below its floor fails; a crate more than `margin` points above it also fails until the
# floor is raised, so the floor tracks reality. Edit a floor only with a stated reason.
# Coverage shows what tests execute, not what they check: mutation testing measures that.

margin = 3.0

[crate.bleedthrough-builtins]
floor = 96.0
reason = "measured 97.55% when recorded; floor one point below"

[crate.bleedthrough-engine]
floor = 0.0
reason = "no executable lines yet (placeholder crate); the stale-floor rule forces a real floor when code lands"

[crate.bleedthrough-findings]
floor = 93.0
reason = "measured 94.31% when recorded; floor one point below"

[crate.bleedthrough-ir]
floor = 0.0
reason = "no executable lines yet (placeholder crate); the stale-floor rule forces a real floor when code lands"

[crate.bleedthrough-packs]
floor = 0.0
reason = "no executable lines yet (placeholder crate); the stale-floor rule forces a real floor when code lands"

[crate.bleedthrough-rules]
floor = 94.0
reason = "measured 95.52% after the mutation-hardening change; floor one point below"

[crate.bleedthrough-symbols]
floor = 96.0
reason = "measured 97.62% after the mutation-hardening change; floor one point below"

[crate.bleedthrough-syntax]
floor = 97.0
reason = "measured 98.32% after the mutation-hardening change; floor one point below"

[crate.bleedthrough-taxonomy]
floor = 94.0
reason = "measured 95.50% when recorded; floor one point below"
