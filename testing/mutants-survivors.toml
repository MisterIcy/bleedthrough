# Surviving mutants tolerated by `cargo xtask mutants`, each with a reason (docs/testing.md).
# A survivor not listed here fails the scheduled run; an entry whose mutant is now caught or gone fails
# it until removed. Keys carry no line numbers. In security-critical code (testing/mutants-critical.toml)
# only `equivalent = true` entries are accepted: anything else is fixed with a test.
#
# Every entry is analysed: a survivor is either equivalent (with the proof), a bound tested elsewhere (naming the
# test), or a timeout-only case. The loader refuses `baseline` entries and reasons that admit no analysis.

[[survivor]]
crate = "bleedthrough-builtins"
file = "crates/builtins/src/validate.rs"
mutant = "replace match guard c.is_whitespace() with false in tokens"
reason = "Equivalent. ASCII white space then falls to the catch-all arm, which pushes the same \" \" token; a control white space character is refused earlier by clean(); a non-ASCII white space (no-break space) is an identifier part, so it was already absorbed into the preceding word, and after a non-word token it only changes which word starts, not whether two words are adjacent."
equivalent = true

[[survivor]]
crate = "bleedthrough-symbols"
file = "crates/symbols/src/builtin.rs"
mutant = "delete match arm ClassKind::Enum in syntax_kind"
reason = "Equivalent. The class context built from the kind only tells a trait apart (self is late-bound there); a class, an interface and an enum resolve self, static and parent identically, so falling through to Class gives the same context."
equivalent = true

[[survivor]]
