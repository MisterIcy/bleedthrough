mutant = "delete match arm ClassKind::Interface in syntax_kind"
reason = "Equivalent. The class context built from the kind only tells a trait apart (self is late-bound there); a class, an interface and an enum resolve self, static and parent identically, so falling through to Class gives the same context."
equivalent = true

[[survivor]]
crate = "bleedthrough-symbols"
file = "crates/symbols/src/docblock/lexer.rs"
mutant = "replace += with *= in Lexer<'a>::lex_from"
reason = "Equivalent. The advanced position is the end of a Bad token, which nothing reads: the parser never eats a Bad token, so no path advances past it or looks at the text after it; every path either fails at it or stops there, and only its start is used for the consumed length and spans."
equivalent = true

[[survivor]]
crate = "bleedthrough-symbols"
file = "crates/symbols/src/docblock/tags.rs"
mutant = "replace + with - in Collector<'_, '_>::method_decl"
reason = "Equivalent. The type parser reports its consumed length up to the start of the next token, so the text after a parsed return type never begins with white space; the white space width that is added is always 0."
equivalent = true
