[[survivor]]
crate = "bleedthrough-symbols"
file = "crates/symbols/src/infer/expr.rs"
mutant = "replace && with || in Interp<'a>::match_expr"
reason = "Equivalent. MatchArm documents that an empty condition list is the default arm, so is_default and conditions.is_empty() are one fact; !a && !b and !a || !b agree when a and b are equal."
equivalent = true

[[survivor]]
crate = "bleedthrough-symbols"
file = "crates/symbols/src/infer/ops.rs"
mutant = "replace || with && in arith"
reason = "Equivalent. When one operand is never, the loops over the operands' atoms have no pair to visit and union_all of nothing is never, which is what the early return gives; fold_int needs a literal atom on both sides, so it cannot intervene."
equivalent = true

