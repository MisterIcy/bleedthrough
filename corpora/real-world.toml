# The real-world corpus: third-party PHP projects the parser and, later, the scanner are exercised
# against for robustness, determinism and parse-failure budgets. Pinned by exact commit and by the
# SHA-256 of the GitHub archive of that commit. Fetched on demand (`cargo xtask fetch-corpus`) into
# a cache outside version control; nothing fetched is committed, packaged or redistributed.
#
# Selection criteria: actively used and of the PHP 8 era; permissively licensed, or at least
# source-available (analysed, never redistributed); a mix of framework, non-framework and legacy
# procedural code; spanning the size tiers. Tiers count `.php` files: small < 100, medium 100 to 999,
# large 1000 or more. Replacing a project is a reviewed edit of this file.
#
# A `sha256` that no longer matches is a loud failure, not a refresh: GitHub has changed archive bytes
# before, and the fix is a reviewed edit of the pin.

