name: mutants

# Mutation testing of the domain crates (docs/testing.md, spec `mutation-testing`). Never part of the required
# `ci` status: it runs weekly, on demand, and on a pull request only when the `run-mutants` label is added
# (then limited to the code the pull request changes). One job per crate; each publishes its report and fails
# when a surviving mutant is not in testing/mutants-survivors.toml or a ledger entry is stale.
on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:
    inputs:
      package:
        description: "Mutate only this crate (default: all)"
        required: false
      base:
        description: "Mutate only code changed since this revision (default: everything)"
        required: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Exact version of the external tool; bump like any pinned tool (docs/testing.md).
  CARGO_MUTANTS_VERSION: "27.1.0"

jobs:
  mutants:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-mutants'
    name: mutants (${{ matrix.crate }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: bleedthrough-taxonomy
          - crate: bleedthrough-builtins
          - crate: bleedthrough-syntax
          - crate: bleedthrough-rules
          - crate: bleedthrough-findings
          - crate: bleedthrough-symbols
          # The tests of ir and engine run through the parser adapter (about four minutes a pass), so
          # their mutants are sharded to keep each job within its time limit.
          - { crate: bleedthrough-ir, shard: "1/4", part: "1" }
          - { crate: bleedthrough-ir, shard: "2/4", part: "2" }
          - { crate: bleedthrough-ir, shard: "3/4", part: "3" }
          - { crate: bleedthrough-ir, shard: "4/4", part: "4" }
          - { crate: bleedthrough-engine, shard: "1/8", part: "1" }
          - { crate: bleedthrough-engine, shard: "2/8", part: "2" }
          - { crate: bleedthrough-engine, shard: "3/8", part: "3" }
          - { crate: bleedthrough-engine, shard: "4/8", part: "4" }
          - { crate: bleedthrough-engine, shard: "5/8", part: "5" }
          - { crate: bleedthrough-engine, shard: "6/8", part: "6" }
          - { crate: bleedthrough-engine, shard: "7/8", part: "7" }
          - { crate: bleedthrough-engine, shard: "8/8", part: "8" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked
      - name: Mutate
        id: run
        shell: bash
        run: |
          args=(--package "${{ matrix.crate }}" --jobs 2 --out target/mutants)
          if [ -n "${{ matrix.shard }}" ]; then args+=(--shard "${{ matrix.shard }}"); fi
          only="${{ github.event.inputs.package }}"
          if [ -n "$only" ] && [ "$only" != "${{ matrix.crate }}" ]; then
            echo "skipped: $only was requested"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--in-diff "$(git merge-base "origin/${{ github.base_ref }}" HEAD)")
          elif [ -n "${{ github.event.inputs.base }}" ]; then
            args+=(--in-diff "${{ github.event.inputs.base }}")
          fi
          cargo xtask mutants "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.crate }}-${{ matrix.part }}
          path: |
            target/mutants/report.json
            target/mutants/outcomes.txt
            target/mutants/mutants.out/outcomes.json
            target/mutants/mutants.out/missed.txt
            target/mutants/mutants.out/timeout.txt
