name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Every job takes its toolchain from rust-toolchain.toml (the single source of truth).
# There is no nightly job.
jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  layering:
    name: layering + manifest policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-layering

  glossary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-glossary

  builtins:
    name: built-in data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Offline: regenerates from the vendored stubs and fixtures; never runs PHP or pulls images.
      - run: cargo xtask check-builtins

  public-api:
    name: public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-api

  conformance:
    name: conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p bleedthrough-syntax-mago --test conformance

  # Re-runs `php -l` in the official image for every PHP version of the ledger (pinned by digest in
  # fixtures/php/images.toml). A version that cannot be run is listed as unverified, never verified.
  ledger:
    name: fixture ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Verify the ledger against real interpreters
        run: cargo run --locked -p bleedthrough-syntax-conformance --example ledger -- verify --docker | tee -a "$GITHUB_STEP_SUMMARY"

  # Single required status: configure branch protection to require only this job.
  ci:
    name: CI status
    if: always()
    needs: [build-test, fmt, clippy, deny, layering, glossary, public-api, conformance, ledger]
    runs-on: ubuntu-latest
    steps:
      - name: Report gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key' | paste -sd, -)
          if [ -n "$failed" ]; then echo "::error::Failing gates: $failed"; exit 1; fi
