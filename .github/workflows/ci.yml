name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Every job takes its toolchain from rust-toolchain.toml (the single source of truth).
# There is no nightly job.
jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  layering:
    name: layering + manifest policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-layering

  hygiene:
    name: test hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Ignored tests carry reasons and no default test runs PHP or Docker; prints the ignored count.
      - run: cargo xtask check-tests | tee -a "$GITHUB_STEP_SUMMARY"

  glossary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-glossary

  builtins:
    name: built-in data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Offline: regenerates from the vendored stubs and fixtures; never runs PHP or pulls images.
      - run: cargo xtask check-builtins

  public-api:
    name: public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-api

  conformance:
    name: conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p bleedthrough-syntax-mago --test conformance

  corpus:
    name: vulnerability corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Offline: manifest, files, twins, CWEs, licences and sizes; no scan, no network.
      - run: cargo xtask check-corpus
      # The pinned real-world list only; nothing is fetched in required CI.
      - run: cargo xtask check-corpora
      - run: cargo test --locked -p bleedthrough-syntax-mago --test vuln_corpus

  bench-counters:
    name: benchmark counters
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Deterministic allocation and input counters against benchmarks/baselines.toml; wall time is
      # never gated here (it is noisy on shared runners; see docs/benchmarks.md).
      - run: cargo xtask bench-counters

  accuracy:
    name: accuracy evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Scorer tests
        run: cargo test --locked -p bleedthrough-eval
      # `not evaluated` passes only while `scan-switch` in fixtures/vuln/expectations.toml is false.
      - name: Evaluate
        shell: bash # pipefail, so the verdict's exit status survives `tee`
        run: cargo xtask eval --ci --json "$RUNNER_TEMP/eval.json" | tee -a "$GITHUB_STEP_SUMMARY"

  # Re-runs `php -l` in the official image for every PHP version of the ledger (pinned by digest in
  # fixtures/php/images.toml). A version that cannot be run is listed as unverified, never verified.
  ledger:
    name: fixture ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Verify the ledger against real interpreters
        run: cargo run --locked -p bleedthrough-syntax-conformance --example ledger -- verify --docker | tee -a "$GITHUB_STEP_SUMMARY"

  # Single required status: configure branch protection to require only this job.
  ci:
    name: CI status
    if: always()
    needs: [build-test, fmt, clippy, deny, layering, hygiene, glossary, public-api, conformance, ledger, corpus, bench-counters, accuracy]
    runs-on: ubuntu-latest
    steps:
      - name: Report gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key' | paste -sd, -)
          if [ -n "$failed" ]; then echo "::error::Failing gates: $failed"; exit 1; fi
