# Accuracy expectations: the ratchet `cargo xtask eval` compares against.
# Change only with `cargo xtask eval --update` and review the printed diff.

[eval]
# Records that the `bleedthrough` binary has a scan command. While false, an evaluation
# that reports `not evaluated` passes CI; once true it fails. The change that adds the
# scan command must flip it (see docs/evaluation.md).
scan-switch = false

