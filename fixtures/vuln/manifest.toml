# Manifest of the vulnerability fixture corpus (see README.md and schemas/vuln-manifest.schema.json).
# Cases are generated once from templates and then maintained by hand; expectations name CWEs, never rules.

# The closed vocabulary of flow shapes. `correct-sanitizer` is covered by safe twins.
shapes = ["direct", "local-flow", "array-element", "user-function", "method", "cross-file-include", "autoload-class", "framework-request", "correct-sanitizer", "wrong-sanitizer"]

# ---- CWE-89: SQL injection ----
