[workspace]
resolver = "3"
members = ["crates/*", "adapters/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MisterIcy/bleedthrough"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"

# The parser safety net (`catch_unwind` in the Mago adapter) only works when panics unwind.
# Never set `panic = "abort"` in any profile; a test in the adapter proves a caught panic does not abort.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"
