# Layering declaration, checked by `cargo xtask check-layering`.
# A workspace dependency is permitted only if listed in `allow`. New edges need a
# comment justifying them (see docs/architecture.md and the review checklist).

[policy]
# Infrastructure crates banned from domain manifests (exact name or `prefix*`).
# serde derive support is allowed: data-contract derives do no IO.
domain_denied = [
  "walkdir", "ignore", "glob", "globset", "notify",
  "reqwest", "hyper", "ureq", "isahc", "curl", "attohttpc",
  "tokio*", "async-std", "smol", "futures-executor", "rayon",
  "serde_json", "toml", "toml_edit", "serde_yaml", "serde_yml", "yaml-rust*", "ron", "csv", "bincode",
  "rusqlite", "sled", "redb", "rocksdb",
  "tempfile", "dirs", "home", "which",
]
# Third-party PHP parser backends: reachable only from adapter crates, exact-pinned.
parser_backends = ["mago-*", "tree-sitter*", "php-parser-rs", "php-rs-parser"]

# ---- Domain (pure) ----
[crate.bleedthrough-syntax]
layer = "domain"
allow = []

[crate.bleedthrough-taxonomy]
layer = "domain"
allow = []

# PHP built-in symbol data: record model, version masks, text format and the source port.
[crate.bleedthrough-builtins]
layer = "domain"
allow = []

[crate.bleedthrough-rules]
layer = "domain"
allow = ["bleedthrough-taxonomy"]

[crate.bleedthrough-findings]
layer = "domain"
allow = ["bleedthrough-taxonomy"]

[crate.bleedthrough-symbols]
layer = "domain"
allow = ["bleedthrough-syntax"]

[crate.bleedthrough-ir]
layer = "domain"
allow = ["bleedthrough-symbols", "bleedthrough-syntax"]

[crate.bleedthrough-packs]
layer = "domain"
allow = ["bleedthrough-rules"]

[crate.bleedthrough-engine]
layer = "domain"
allow = [
  "bleedthrough-ir", "bleedthrough-symbols", "bleedthrough-syntax",
  "bleedthrough-rules", "bleedthrough-packs", "bleedthrough-findings", "bleedthrough-taxonomy",
]

# ---- Application ----
[crate.bleedthrough-app]
layer = "application"
allow = [
  "bleedthrough-engine", "bleedthrough-findings", "bleedthrough-syntax",
  "bleedthrough-symbols", "bleedthrough-rules", "bleedthrough-packs",
]

# ---- Infrastructure (implements ports owned by inner layers) ----
[crate.bleedthrough-emit]
layer = "infrastructure"
allow = ["bleedthrough-app", "bleedthrough-findings", "bleedthrough-taxonomy"]

[crate.bleedthrough-fs]
layer = "infrastructure"
allow = ["bleedthrough-app", "bleedthrough-rules", "bleedthrough-packs"]

# Parser adapter: the only crate that may depend on a third-party parser (exact pins).
# The conformance suite is a dev-dependency only (exempt from the edge rule, see layering.rs).
[crate.bleedthrough-syntax-mago]
layer = "infrastructure"
adapter = true
allow = ["bleedthrough-syntax"]

[crate.bleedthrough-cache]
layer = "infrastructure"
allow = ["bleedthrough-app", "bleedthrough-engine", "bleedthrough-symbols"]

# ---- Delivery (composition root) ----
[crate.bleedthrough-cli]
layer = "delivery"
# The composition root wires the parser adapter (no Cargo edge exists until the CLI is built).
allow = ["bleedthrough-app", "bleedthrough-emit", "bleedthrough-fs", "bleedthrough-cache", "bleedthrough-syntax-mago"]

# ---- Tooling ----
# Backend-agnostic conformance suite over the PHP fixture corpus; used by adapters as a dev-dependency.
[crate.bleedthrough-syntax-conformance]
layer = "tooling"
allow = ["bleedthrough-syntax"]

# Generates the built-in data from the vendored php-src stubs. It is generic over the parser backend
# (the Mago adapter runs it from an example, as a dev-dependency) and owns no I/O format of its own.
[crate.bleedthrough-builtins-gen]
layer = "tooling"
allow = ["bleedthrough-syntax", "bleedthrough-builtins"]

# The accuracy evaluator: loads the vulnerability corpus, scores a `json` report against its labels
# and compares the result with the committed expectations. It reads the report as text (it never links
# the engine or the CLI); xtask runs it as a subprocess, like the built-in data generator.
[crate.bleedthrough-eval]
layer = "tooling"
allow = ["bleedthrough-taxonomy"]

# The benchmark harness and the synthetic tree generator. The parse stage is generic over the parser
# backend (the Mago adapter binds it in an example); the end-to-end stage runs the built binary as a
# subprocess, so no tooling crate depends on the CLI or an adapter.
[crate.bleedthrough-bench]
layer = "tooling"
allow = ["bleedthrough-syntax"]

[crate.xtask]
layer = "tooling"
allow = []
