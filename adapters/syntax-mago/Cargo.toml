[package]
name = "bleedthrough-syntax-mago"
version = "0.0.0"
description = "Bleedthrough infrastructure adapter: implements the parser-backend port with the Mago PHP parser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bleedthrough-syntax = { path = "../../crates/syntax" }
# Exact pins: all direct Mago crates move together (see docs/mago-upgrade.md).
mago-syntax = "=1.57.0"
mago-span = "=1.57.0"
mago-database = "=1.57.0"
mago-allocator = "=1.57.0"

[dev-dependencies]
bleedthrough-syntax-conformance = { path = "../../crates/syntax-conformance" }
bleedthrough-builtins-gen = { path = "../../crates/builtins-gen" }
bleedthrough-eval = { path = "../../crates/eval" }
bleedthrough-bench = { path = "../../crates/bench" }
bleedthrough-symbols-suite = { path = "../../crates/symbols-suite" }
bleedthrough-engine-suite = { path = "../../crates/engine-suite" }
# Loads the engine's TOML test rule sets for the taint tests.
bleedthrough-fs = { path = "../../crates/fs" }
# Allocation counting for the `bench_alloc` example: the counting allocator lives in this crate, so
# no `unsafe` appears in ours (see docs/benchmarks.md).
dhat = "0.3"
