[package]
name = "bleedthrough-emit"
version = "0.0.0"
description = "Bleedthrough infrastructure layer: report emitters implementing application ports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bleedthrough-app = { path = "../app" }
bleedthrough-findings = { path = "../findings" }
bleedthrough-taxonomy = { path = "../taxonomy" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
similar = "2"

[dev-dependencies]
bleedthrough-eval = { path = "../eval" }
bleedthrough-testkit = { path = "../testkit" }
jsonschema = { version = "0.33", default-features = false }
tempfile = "3"

[lints]
workspace = true
