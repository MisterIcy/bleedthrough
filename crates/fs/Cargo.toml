[package]
name = "bleedthrough-fs"
version = "0.0.0"
description = "Bleedthrough infrastructure layer: file-system access implementing application ports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bleedthrough-rules = { path = "../rules" }
bleedthrough-builtins = { path = "../builtins" }
bleedthrough-symbols = { path = "../symbols" }
# Reads composer.json and composer.lock; infrastructure only, no derive (the values are walked by hand).
serde_json = "1"
# Hashing of the canonical rule set; the same crate and version the findings crate uses.
sha2 = "0.11"
# Spanned TOML parsing for line numbers in rule errors; no serde (infrastructure only).
toml = { version = "1.1.8", default-features = false, features = ["parse", "std"] }

[dev-dependencies]
bleedthrough-testkit = { path = "../testkit" }
tempfile = "3"

[lints]
workspace = true
