schema = 1

[[rule]]
id = "BT9001"
title = "SQL injection"
area = "injection"
description = "Test rule: request data reaches a sensitive operation."
remediation = "Neutralise the data for the operation before using it."
cwe = ["CWE-89"]
owasp = ["OWASP:2021:A03"]

[rule.metrics]
attack_vector = "network"
attack_complexity = "low"
privileges_required = "none"
user_interaction = "none"
scope = "unchanged"
confidentiality = "high"
integrity = "high"
availability = "high"

[rule.taint]
sources = ["$_GET", "$_POST", "$_COOKIE", "$_REQUEST"]

[[rule.taint.sinks]]
symbol = "mysqli_query"
args = [2]
class = "sql"

[[rule.taint.sinks]]
symbol = "mysqli->query+"
args = [1]
class = "sql"

[[rule.taint.sinks]]
symbol = "PDO->query+"
args = [1]
class = "sql"

[[rule.taint.sinks]]
symbol = "PDO->exec+"
args = [1]
class = "sql"

[[rule.taint.sanitizers]]
symbol = "mysqli_real_escape_string"
clears = ["sql"]

[[rule.taint.sanitizers]]
symbol = "PDO->quote+"
clears = ["sql"]

[[rule.taint.propagators]]
symbol = "trim"
from = [1]

