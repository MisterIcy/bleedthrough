# Dependency policy, checked by `cargo deny check` (see docs/architecture.md).

[graph]
all-features = true

[licenses]
# Extend only by explicit review. Copyleft and unknown licenses are denied.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[advisories]
# Fails on known vulnerabilities and unmaintained crates; ignore only with a recorded justification.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Parser backends are reachable only through adapter crates (exact pinning is checked by xtask).
deny = [
  { crate = "mago-syntax", wrappers = ["bleedthrough-syntax-mago"] },
  { crate = "mago-database", wrappers = ["bleedthrough-syntax-mago"] },
  { crate = "tree-sitter-php", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
